interventions:
  street_canopy:
    name: "Street Canopy & Green Corridors"
    default_unit_footprint_m2: 1000
    metrics:
      delta_air_c: { min: 0.5, max: 1.6, peak_late_afternoon_max: 2.2 }
      delta_surface_c: null
      delta_pet_c: null
      pedestrian_mrt_penalty_c: 0.0
    capex_eur_per_m2: { low: 21.0, high: 76.92 }
    neb_defaults: { water_demand_score: 0.65, beauty_prior: 0.85, step_free_access: true }
    citations:
      - "Tsiros 2010, DOI:10.1016/j.renene.2009.12.021"
      - "Izmir GCAP 2020 (LU1.7); Johnson et al., DOI:10.1177/2399808320974689"

  high_albedo_paving:
    name: "High-Albedo Cool Paving"
    default_unit_footprint_m2: 1000
    metrics:
      delta_air_c: { min: 0.5, max: 1.9 }
      delta_surface_c: { min: 4.0, max: 6.0 }
      delta_pet_c: null
      pedestrian_mrt_penalty_c: 4.0  # Signed pedestrian radiant warming warning
    capex_eur_per_m2: { low: 57.67, high: 81.0 }
    neb_defaults: { water_demand_score: 0.05, beauty_prior: 0.45, step_free_access: true }
    citations:
      - "Middel et al. 2020, DOI:10.1088/1748-9326/ab87d4"
      - "Santamouris et al. 2012, DOI:10.1016/j.buildenv.2012.01.022"

  high_albedo_roofs:
    name: "High-Albedo Cool Roofs"
    default_unit_footprint_m2: 1000
    metrics:
      delta_air_c: { min: 0.67, max: 2.22, scale_note: "district-scale conversion benchmark" }
      delta_surface_c: { min: 15.0, max: 20.0 }
      delta_pet_c: null
      pedestrian_mrt_penalty_c: 0.0
    capex_eur_per_m2: { low: 57.23, high: 83.0 }
    neb_defaults: { water_demand_score: 0.0, beauty_prior: 0.40, step_free_access: false }
    citations:
      - "Romeo & Zinzi, DOI:10.1016/j.enbuild.2011.07.023"
      - "Gilabert et al. 2021, DOI:10.1016/j.uclim.2021.100863"

  pocket_park:
    name: "Pocket Park & Restorative Shaded Plaza"
    default_unit_footprint_m2: 180
    metrics:
      delta_air_c: { min: 0.6, max: 1.3, max_shaded_vs_sunlit_contrast: 6.9 }
      delta_surface_c: null
      delta_pet_c: null
      pedestrian_mrt_penalty_c: 0.0
    capex_eur_per_m2: { low: 132.70, high: 132.70 }  # EUR 23,885.50 / 180 m2
    neb_defaults: { water_demand_score: 0.55, beauty_prior: 0.95, step_free_access: true }
    citations:
      - "Melas et al. 2021, DOI:10.30955/gnj.003903"
      - "Oliveira et al. 2011, DOI:10.1016/j.buildenv.2011.04.034"
      - "Bagiouk et al. 2024, DOI:10.1007/s40710-024-00690-x"

  shaded_transit_stop:
    name: "Shaded Transit Stop & Pedestrian Micro-Corridor"
    default_unit_footprint_m2: 20
    metrics:
      delta_air_c: { min: 0.6, max: 1.0 }
      delta_surface_c: { min: 13.2, max: 15.9 }
      delta_pet_c: { min: 17.3, max: 18.7 }
      pedestrian_mrt_penalty_c: 0.0
    capex_eur_per_m2: { low: 110.0, high: 286.0 }  # EUR 2,200 - 5,720 per 20 m2 stop
    neb_defaults: { water_demand_score: 0.0, beauty_prior: 0.70, step_free_access: true }
    citations:
      - "Dzyuban et al., DOI:10.1007/s00484-021-02074-4"
      - "Garcia-Nevado et al. 2020, DOI:10.1016/j.scs.2020.102458"